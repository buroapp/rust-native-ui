[workspace]
resolver = "2"
members = [
    "rn-core",
    "rn",
    "rn-layout",
    "rn-macos",
    "rn-windows",
    "rn-linux",
    "examples/hello-world",
    "examples/counter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/buroapp/rust-native-ui"
authors = ["Rust Native contributors"]

[workspace.dependencies]
crossbeam-channel = "0.5"
log = "0.4"
taffy = "0.5"
env_logger = "0.11"
criterion = "0.5"
# Platform backends
objc2 = "0.5"
objc2-app-kit = "0.2"
objc2-foundation = "0.2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
gtk4 = "0.9"
