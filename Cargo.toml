[workspace]
resolver = "2"
members = [
    "rn-core",
    "rn",
    "rn-layout",
    "rn-macos",
    "rn-windows",
    "rn-linux",
    "examples/hello-world",
    "examples/counter",
    "examples/gallery",
    "examples/showcase",
    "examples/settings-demo",
    "examples/mail-demo",
    "examples/storybook",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/buroapp/rust-native-ui"
authors = ["Rust Native contributors"]

[workspace.dependencies]
crossbeam-channel = "0.5"
log = "0.4"
taffy = "0.5"
env_logger = "0.11"
criterion = "0.5"
# Platform backends
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWindow",
    "NSView",
    "NSControl",
    "NSTextField",
    "NSButton",
    "NSButtonCell",
    "NSGraphics",
    "NSEvent",
    "NSColor",
    "NSColorWell",
    "NSText",
    "NSCell",
    "NSSlider",
    "NSSliderCell",
    "NSProgressIndicator",
    "NSScrollView",
    "NSScroller",
    "NSPopUpButton",
    "NSPopUpButtonCell",
    "NSMenu",
    "NSMenuItem",
    "NSDatePicker",
    "NSDatePickerCell",
    "NSImageView",
    "NSImage",
    "NSStepper",
    "NSStepperCell",
    "NSTextView",
    "NSBox",
    "NSMatrix",
    "NSSearchField",
    "NSSearchFieldCell",
    "NSSegmentedControl",
    "NSSegmentedCell",
    "NSSwitch",
    "NSSplitView",
    "NSLevelIndicator",
    "NSLevelIndicatorCell",
    "NSSplitViewController",
    "NSSplitViewItem",
    "NSToolbar",
    "NSToolbarItem",
    "NSPanel",
    "NSPopover",
    "NSOutlineView",
    "NSTableView",
    "NSTableColumn",
    "NSTableCellView",
    "NSTableRowView",
    "NSVisualEffectView",
    "NSClipView",
    "NSAttributedString",
    "NSFont",
    "NSFontDescriptor",
    "NSFontManager",
    "NSParagraphStyle",
    "NSShadow",
    "NSTextStorage",
    "NSTextContainer",
    "NSLayoutManager",
    "NSStringDrawing",
] }
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSObject",
    "NSGeometry",
    "NSNotification",
    "NSThread",
    "NSTimer",
    "NSDate",
    "NSRunLoop",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSValue",
    "NSAttributedString",
] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
gtk4 = { version = "0.9", features = ["v4_8"] }
