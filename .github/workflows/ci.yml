name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            feature: macos
          - os: windows-latest
            feature: windows
          - os: ubuntu-latest
            feature: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GTK4 deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - name: cargo check (workspace, no features)
        run: cargo check --workspace

      - name: cargo check (rn with ${{ matrix.feature }} backend)
        run: cargo check -p rn --features ${{ matrix.feature }}

      - name: cargo build (hello-world)
        run: cargo build -p hello-world --features ${{ matrix.feature }}

      - name: cargo build (counter)
        run: cargo build -p counter --features ${{ matrix.feature }}

      - name: cargo build (gallery)
        run: cargo build -p gallery --features ${{ matrix.feature }}

      - name: cargo test (headless reconciler suite)
        run: cargo test -p rn --test reconciler

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
