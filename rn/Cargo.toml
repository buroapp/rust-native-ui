[package]
name = "rn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust Native — declarative cross-platform native UI framework (React Native model for Rust)"
categories = ["gui", "rendering"]
keywords = ["native", "gui", "cross-platform", "react-native"]
readme = "../README.md"

[dependencies]
crossbeam-channel = { workspace = true }
log = { workspace = true }
rn-core = { path = "../rn-core", version = "0.1.0" }
rn-layout = { path = "../rn-layout", version = "0.1.0" }
rn-macos = { path = "../rn-macos", version = "0.1.0", optional = true }
rn-windows = { path = "../rn-windows", version = "0.1.0", optional = true }
rn-linux = { path = "../rn-linux", version = "0.1.0", optional = true }

[features]
default = []
macos = ["dep:rn-macos"]
windows = ["dep:rn-windows"]
linux = ["dep:rn-linux"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "reconciler"
harness = false
required-features = []

[[test]]
name = "reconciler"
path = "../tests/reconciler/tests.rs"

[[test]]
name = "e2e_gallery"
path = "../tests/e2e/gallery.rs"
